<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emaar Misr - Identity Badge</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Bodoni Moda (for Title) & Inter (for clean UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f8;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    .font-badge-title {
      font-family: 'Bodoni Moda', serif;
    }

    .font-emaar {
      font-family: 'Bodoni Moda', serif;
      letter-spacing: 0.18em;
    }

    /* Subtle paper texture background matching original app background */
    .app-bg {
      background-color: #f6f6f7;
      background-image: radial-gradient(#e2e3e6 0.75px, transparent 0.75px);
      background-size: 12px 12px;
    }
  </style>
</head>
<body class="app-bg min-h-screen text-slate-900 flex flex-col items-center justify-between p-4 pb-8 max-w-md mx-auto relative overflow-x-hidden">

  <!-- Top Navigation Header with Back Arrow -->
  <div class="w-full flex items-center justify-between pt-2 pb-4 px-2">
    <button class="text-slate-800 text-2xl font-light hover:opacity-70 transition-opacity active:scale-95 px-1" onclick="console.log('Back clicked')">
      &#10094;
    </button>
    <h1 class="font-badge-title text-2xl font-bold tracking-tight text-slate-900 mx-auto -ml-4">
      Identity Badge
    </h1>
    <div class="w-4"></div> <!-- Spacer to align center properly -->
  </div>

  <!-- Main Content Body -->
  <div class="w-full flex flex-col items-center flex-grow justify-center -mt-2">
    
    <!-- Profile Photo Container -->
    <div class="relative z-10 -mb-20">
      <div class="w-64 h-64 rounded-full p-[3.5px] bg-[#89c57d] shadow-sm flex items-center justify-center overflow-hidden">
        <img 
          src="https://i.postimg.cc/bvCK6Hkq/IMG-5696.jpg" 
          alt="Profile" 
          class="w-full h-full object-cover rounded-full"
        />
      </div>
    </div>

    <!-- Main Outer Card Container -->
    <div class="w-full bg-[#eceef2] rounded-3xl overflow-hidden shadow-sm pt-20">
      
      <!-- Username & Type Banner (Straight full-width bar, no side gaps) -->
      <div class="bg-[#a3d99b] px-5 py-3 flex justify-between items-end w-full">
        <div>
          <div class="text-[13px] text-slate-700 font-medium leading-none mb-1">Username</div>
          <div class="text-[17px] font-bold text-slate-900 leading-none">Ali Abdelaziz</div>
        </div>
        <div class="text-right">
          <div class="text-[13px] text-slate-700 font-medium leading-none mb-1">Type</div>
          <div class="text-[17px] font-bold text-slate-900 leading-none">Resident</div>
        </div>
      </div>

      <!-- Unit Box Section -->
      <div class="p-5 flex justify-between items-center bg-[#eceef2]">
        <div class="pr-2">
          <div class="text-[13px] text-slate-500 font-medium mb-1">Unit</div>
          <div class="text-[15px] sm:text-[16px] font-bold text-slate-900 whitespace-nowrap tracking-tight">
            Boulevard Residence 2-D-3-5
          </div>
        </div>
        <!-- QR Code Icon -->
        <div class="bg-slate-200/60 p-2 rounded-xl flex-shrink-0 cursor-pointer hover:bg-slate-300/60 transition-colors">
          <svg class="w-6 h-6 text-slate-700" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 0h2v3h-2v-3zm3 3h3v5h-3v-5zm-3 2h2v3h-2v-3zm-2-2h2v2h-2v-2z"/>
          </svg>
        </div>
      </div>

    </div>

    <!-- Action Button: Open Gate -->
    <div class="w-full mt-6">
      <button 
        id="openGateBtn"
        onclick="startCountdown()"
        class="w-full bg-[#6d7177] hover:bg-[#5f6368] active:scale-[0.99] transition-all text-white font-medium text-[16.5px] py-3.5 rounded-2xl shadow-sm tracking-wide text-center"
      >
        Open Gate
      </button>
    </div>

    <!-- Legal Disclaimer Notice -->
    <p class="text-[11.5px] text-center text-slate-800 leading-tight px-6 mt-5 font-normal">
      Any proven manipulation of this identity will result in a<br>
      EGP 30,000 fine and user suspension.
    </p>

  </div>

  <!-- Footer Logo -->
  <div class="w-full text-center mt-6">
    <div class="font-emaar text-xl font-bold tracking-[0.25em] text-slate-900">
      EMAAR
    </div>
    <div class="text-[9px] font-medium tracking-[0.3em] text-slate-500 uppercase mt-0.5">
      MISR
    </div>
  </div>

  <!-- Countdown Script -->
  <script>
    let isCounting = false;
    let timer = null;

    function startCountdown() {
      if (isCounting) return;
      
      isCounting = true;
      const btn = document.getElementById('openGateBtn');
      let count = 5;

      btn.classList.add('opacity-90', 'cursor-not-allowed');
      btn.innerText = `Opening gate in ${count}...`;

      timer = setInterval(() => {
        count--;
        if (count > 0) {
          btn.innerText = `Opening gate in ${count}...`;
        } else {
          clearInterval(timer);
          btn.innerText = "Gate Opened!";
          btn.classList.remove('bg-[#6d7177]', 'hover:bg-[#5f6368]');
          btn.classList.add('bg-emerald-600');

          setTimeout(() => {
            btn.innerText = "Open Gate";
            btn.classList.remove('bg-emerald-600', 'opacity-90', 'cursor-not-allowed');
            btn.classList.add('bg-[#6d7177]', 'hover:bg-[#5f6368]');
            isCounting = false;
          }, 2500);
        }
      }, 1000);
    }
  </script>
</body>
</html>
