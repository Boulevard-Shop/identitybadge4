<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Identity Badge</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Lora (matches Identity Badge serif) + Cinzel + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['Lora', 'Georgia', 'serif'],
            brand: ['Cinzel', 'Times New Roman', 'serif'],
          },
          colors: {
            badgeGreen: '#b3e8a8',
            ringGreen: '#82d66d',
            cardBg: '#eff0f3',
            btnGray: '#808285',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f5f5f7;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .badge-bg {
      background-color: #ffffff;
    }
  </style>
</head>
