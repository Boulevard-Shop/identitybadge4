<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Identity Badge</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Libre Baskerville (matches the crisp, wide serif "Identity Badge" title) + Cinzel + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['"Libre Baskerville"', 'Georgia', 'serif'],
            brand: ['Cinzel', 'Times New Roman', 'serif'],
          },
          colors: {
            badgeGreen: '#a8e39a',
            ringGreen: '#7ed967',
            cardBg: '#eff0f2',
            btnGray: '#8a8c8f',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f5f5f7;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .badge-bg {
      background-color: #ffffff;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-900 antialiased p-0 sm:p-4">

  <!-- Mobile Container Wrapper -->
  <div class="w-full max-w-[414px] badge-bg min-h-[844px] sm:rounded-[44px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-gray-200/80">

    <!-- Top Left Back Arrow -->
    <button class="absolute top-6 left-5 text-black hover:opacity-70 transition-opacity z-20 cursor-pointer p-1">
      <svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"></path>
      </svg>
    </button>

    <!-- Main Content Area -->
    <div class="px-4 pt-12 pb-7 flex-1 flex flex-col items-center justify-between z-10">

      <!-- Header Title: Exact Libre Baskerville Bold proportion & scale -->
      <div class="text-center mt-2">
        <h1 class="font-serif font-bold text-[25.5px] text-[#1a1a1a] tracking-[-0.015em] leading-tight">Identity Badge</h1>
      </div>

      <!-- Unified Card Stack (1:1 Proportions matching the reference image) -->
      <div class="w-full relative flex flex-col items-center mt-2">
        
        <!-- Profile Image Stacked Above Grey Card -->
        <div class="relative z-10 flex justify-center items-center -mb-[104px]">
          <div class="w-[266px] h-[266px] rounded-full border-[5px] border-[#7ed967] overflow-hidden bg-gray-900 shadow-xs">
            <img 
              src="https://i.postimg.cc/bvCK6Hkq/IMG-5696.jpg" 
              alt="Ali Abdelaziz" 
              class="w-full h-full object-cover object-center"
            />
          </div>
        </div>

        <!-- Details Card Container -->
        <div class="w-full bg-[#eff0f2] rounded-[22px] pt-[124px] overflow-hidden">
          
          <!-- Lighter Green Banner -->
          <div class="bg-[#a8e39a] px-6 py-3 flex justify-between items-center w-full">
            <div class="flex flex-col">
              <span class="text-[12.5px] text-[#4b5849] font-normal leading-tight">Username</span>
              <span class="text-[16.5px] font-semibold text-[#111111] leading-snug mt-0.5 tracking-tight">Ali Abdelaziz</span>
            </div>
            <div class="flex flex-col items-end">
              <span class="text-[12.5px] text-[#4b5849] font-normal leading-tight">Type</span>
              <span class="text-[16.5px] font-semibold text-[#111111] leading-snug mt-0.5 tracking-tight">Resident</span>
            </div>
          </div>

          <!-- Unit & Detailed QR Code Circle Area -->
          <div class="px-6 py-[18px] bg-[#eff0f2] flex justify-between items-center">
            <div class="flex flex-col max-w-[80%]">
              <span class="text-[12.5px] text-[#6e7175] font-normal leading-tight">Unit</span>
              <span class="text-[16px] font-semibold text-[#111111] leading-snug mt-0.5 whitespace-nowrap overflow-hidden text-ellipsis">Boulevard Residence 2-D-4-5</span>
            </div>
            
            <!-- Exact Mini QR Code Circular Badge -->
            <button onclick="toggleQRModal()" aria-label="Show QR Code" class="w-[42px] h-[42px] bg-[#e2e4e8] rounded-full flex items-center justify-center active:scale-95 transition-transform cursor-pointer shrink-0">
              <svg class="w-[22px] h-[22px] text-[#6d7075]" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <!-- Top-Left Finder Pattern -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M3 3H10V10H3V3ZM4.5 4.5V8.5H8.5V4.5H4.5Z"/>
                <rect x="5.75" y="5.75" width="1.5" height="1.5"/>
                <!-- Top-Right Finder Pattern -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M14 3H21V10H14V3ZM15.5 4.5V8.5H19.5V4.5H15.5Z"/>
                <rect x="16.75" y="5.75" width="1.5" height="1.5"/>
                <!-- Bottom-Left Finder Pattern -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M3 14H10V21H3V14ZM4.5 15.5V19.5H8.5V15.5H4.5Z"/>
                <rect x="5.75" y="16.75" width="1.5" height="1.5"/>
                <!-- Center & Bottom-Right QR Matrix Dots -->
                <rect x="11.25" y="3" width="1.5" height="1.5"/>
                <rect x="11.25" y="6" width="1.5" height="2.5"/>
                <rect x="3" y="11.25" width="2.5" height="1.5"/>
                <rect x="7" y="11.25" width="1.5" height="1.5"/>
                <rect x="10" y="11.25" width="2.5" height="1.5"/>
                <rect x="14" y="11.25" width="1.5" height="2.5"/>
                <rect x="17" y="11.25" width="1.5" height="1.5"/>
                <rect x="19.5" y="11.25" width="1.5" height="2.5"/>
                <rect x="11.25" y="14" width="1.5" height="2.5"/>
                <rect x="14" y="15.5" width="2.5" height="1.5"/>
                <rect x="18" y="15.5" width="1.5" height="1.5"/>
                <rect x="11.25" y="18" width="1.5" height="3"/>
                <rect x="14" y="18.5" width="1.5" height="2.5"/>
                <rect x="16.75" y="17.5" width="1.5" height="1.5"/>
                <rect x="19.5" y="18" width="1.5" height="3"/>
                <rect x="17" y="19.5" width="1.5" height="1.5"/>
              </svg>
            </button>
          </div>

          <!-- Action Button Integrated at Bottom of Card Stack (Exact Reference Proportions & Grey #8a8c8f) -->
          <button 
            id="openGateBtn"
            onclick="startInButtonCountdown()" 
            class="w-full bg-[#8a8c8f] hover:bg-[#7d7f82] active:bg-[#707275] text-white font-normal text-[15.5px] py-[13px] px-6 rounded-[14px] transition-all duration-150 cursor-pointer flex items-center justify-center">
            <span id="btnText">Open Gate</span>
          </button>

        </div>
      </div>

      <!-- Fine Warning Text -->
      <p class="text-[12px] text-center text-[#1e1e1e] font-normal px-4 leading-[1.35]">
        Any proven manipulation of this identity will result in a EGP 30,000 fine and user suspension.
      </p>

      <!-- Footer Branding Logo -->
      <div class="mb-1 text-center flex flex-col items-center">
        <span class="font-brand text-[23px] font-normal tracking-[0.14em] text-[#3a3a3a] leading-none uppercase">EMAAR</span>
        <span class="text-[9px] tracking-[0.36em] text-[#5c5c5c] font-medium mt-1.5 uppercase">MISR</span>
      </div>

    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="hidden absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-6 backdrop-blur-sm">
      <div class="w-[280px] bg-white rounded-[22px] p-6 shadow-2xl flex flex-col items-center text-center border border-gray-100">
        <h3 class="text-[18px] font-semibold text-black mb-1">Resident Access QR</h3>
        <p class="text-[12px] text-gray-500 mb-4">Scan at gate scanner for entry</p>

        <div class="p-3 bg-white rounded-2xl shadow-sm mb-4 border border-gray-100">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=EMAAR_BOULEVARD_2D45_ALI" alt="QR Code" class="w-44 h-44 object-contain">
        </div>

        <button onclick="toggleQRModal()" class="w-full bg-[#007aff] text-white font-medium py-2.5 rounded-xl text-[15px] active:opacity-80 transition-opacity cursor-pointer">
          Done
        </button>
      </div>
    </div>

  </div>

  <script>
    let isCountingDown = false;
    let countdownTimer = null;

    function startInButtonCountdown() {
      if (isCountingDown) return;
      isCountingDown = true;

      const btn = document.getElementById('openGateBtn');
      const btnText = document.getElementById('btnText');
      if (!btn || !btnText) return;

      let count = 5;
      btnText.textContent = `Opening gate in ${count}...`;
      btn.classList.add('opacity-90', 'cursor-not-allowed');

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          btnText.textContent = `Opening gate in ${count}...`;
        } else {
          clearInterval(countdownTimer);
          btnText.textContent = "Gate Opened!";
          btn.classList.remove('bg-[#8a8c8f]');
          btn.classList.add('bg-emerald-600');

          setTimeout(() => {
            btnText.textContent = "Open Gate";
            btn.classList.remove('bg-emerald-600', 'opacity-90', 'cursor-not-allowed');
            btn.classList.add('bg-[#8a8c8f]');
            isCountingDown = false;
          }, 2000);
        }
      }, 1000);
    }

    function toggleQRModal() {
      const qrModal = document.getElementById('qrModal');
      if (qrModal) qrModal.classList.toggle('hidden');
    }
  </script>
</body>
</html>
